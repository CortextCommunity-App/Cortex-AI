services:
  cortex-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: cortex-ai:latest
    container_name: cortex-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Connect to host Ollama instance
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHAT_MODEL=gemma3:4b
      - EMBEDDING_MODEL=nomic-embed-text
      - VISION_MODEL=gemma3:4b
      - CHROMA_DIR=/app/chroma_data
      - COLLECTION_NAME=cortex_knowledge
    volumes:
      # Persist Chroma vector store index across container restarts
      - chroma_data:/app/chroma_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  chroma_data:
    driver: local
